<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — CHINO TECH</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#12213D">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #12213D;
    --navy-deep: #0B1626;
    --orange: #E67E12;
    --orange-deep: #C86A08;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--navy);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:32px;
    line-height:1.6;
  }
  .wrap{max-width:520px;}
  .code{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(64px, 14vw, 110px); color:var(--orange); line-height:1;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(22px, 4vw, 28px); margin-top:16px;
  }
  p{color:#B9C2D1; margin-top:14px; font-size:16px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--orange); color:#fff; text-decoration:none;
    padding:13px 26px; border-radius:3px; font-weight:600; font-size:15px;
    margin-top:32px; transition:all .2s;
  }
  .btn:hover{background:var(--orange-deep); transform:translateY(-2px); box-shadow:0 10px 22px rgba(230,126,18,0.28);}
  .logo{display:inline-flex; align-items:center; gap:10px; margin-bottom:36px;}
  .logo svg{width:34px; height:26px;}
  .logo-text{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; color:#fff;}
  .logo-text span{color:var(--orange);}
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo" aria-label="CHINO TECH — Retour à l'accueil">
      <svg viewBox="0 0 34 26" fill="none">
        <rect x="0" y="0" width="8" height="8" fill="var(--orange)"/>
        <rect x="10" y="0" width="4" height="4" fill="var(--orange)"/>
        <rect x="0" y="10" width="4" height="4" fill="var(--orange)"/>
        <rect x="14" y="4" width="18" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
        <circle cx="23" cy="11" r="3.1" fill="none" stroke="var(--orange)" stroke-width="1.4"/>
        <circle cx="23" cy="11" r="0.9" fill="var(--orange)"/>
        <line x1="19" y1="22" x2="27" y2="22" stroke="#fff" stroke-width="2"/>
      </svg>
      <span class="logo-text">CHINO <span>TECH</span></span>
    </a>
    <div class="code">404</div>
    <h1>Oups ! Cette page s'est perdue dans le réseau 😅</h1>
    <p>La page que vous cherchez n'existe pas, a été déplacée, ou l'adresse comporte une erreur.</p>
    <a class="btn" href="/">
      Retour à l'accueil
      <span style="display:inline-block;">→</span>
    </a>
  </div>
</body>
</html>
